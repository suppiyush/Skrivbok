# Local development services.
#
#   npm run db:up     start Postgres
#   npm run db:down   stop and remove containers
#   npm run db:logs   tail Postgres logs
#
# Data persists in ./docker/postgres-data (gitignored). Delete that folder for a
# clean slate.

services:
  postgres:
    image: postgres:17-alpine
    container_name: skrivbok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skrivbok
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: skrivbok
      # Deterministic collation so ORDER BY behaves identically everywhere.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skrivbok -d skrivbok']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional DB browser at http://localhost:8080 — start with:
  #   docker compose --profile tools up -d adminer
  adminer:
    image: adminer:latest
    container_name: skrivbok-adminer
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
