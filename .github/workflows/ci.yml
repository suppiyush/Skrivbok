name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run — no point paying for
# CI on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skrivbok
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: skrivbok_test
        ports: ['5432:5432']
        # Without this the steps below can start before Postgres accepts
        # connections, and the migration fails intermittently.
        options: >-
          --health-cmd "pg_isready -U skrivbok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://skrivbok:ci_password@localhost:5432/skrivbok_test?schema=public
      DIRECT_URL: postgresql://skrivbok:ci_password@localhost:5432/skrivbok_test?schema=public
      TEST_DATABASE_URL: postgresql://skrivbok:ci_password@localhost:5432/skrivbok_test?schema=public
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SESSION_SECRET: ci-only-secret-not-used-anywhere-real-0123456789
      LOG_LEVEL: fatal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/server/prisma/schema.prisma

      # Ordered cheapest-first: a formatting mistake should not wait for the
      # database tests to find out.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy --schema apps/server/prisma/schema.prisma

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails the job on a high-severity advisory in a production dependency.
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
