# Skrivbok web, inside Docker.
#
# Serves the built app, and forwards the API's paths to the `api` service on the
# Compose network — so, like the Vite dev proxy and the Vercel rewrite, the
# browser talks to one origin.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # JSON bodies are capped at 1MB by the API; uploads go straight to Cloudinary.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:4000;
    }

    location /health/ {
        proxy_pass http://api:4000;
    }

    # Built assets carry a content hash in their names, so they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a route inside the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
